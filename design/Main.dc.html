<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Instrument Sans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    a { color: #8a5a33; } a:hover { color: #6f4023; }
  </style>
</helmet>
<div style="width: 1120px; height: 560px; box-sizing: border-box; padding: 36px 48px 32px; display: flex; flex-direction: column; gap: 20px; background: linear-gradient(112deg, rgba(60,42,25,.10) 0%, rgba(255,252,244,.45) 18%, rgba(255,252,244,.05) 40%, rgba(60,42,25,.08) 62%, rgba(255,252,244,.35) 80%, rgba(60,42,25,.14) 100%), radial-gradient(130% 100% at 50% 0%, #e9decb 0%, #dbcbb0 55%, #c8b294 100%);">

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 11px; letter-spacing: .36em; font-weight: 600; color: rgba(58,42,30,.55);">SWING · COFFEE</div>
    <div style="font-size: 22px; font-weight: 600; color: #2a2119;">四款杯型 · 分层配色</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; align-items: end;">

    <!-- ① Vanilla silk 香草丝绒拿铁 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg viewBox="0 0 170 260" width="184" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="v-cup"><path d="M38 62 L50 232 Q51 240 60 240 L110 240 Q119 240 120 232 L132 62 Z"/></clipPath>
          <linearGradient id="v-milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e9d9"/><stop offset="1" stop-color="#e4d0b2"/></linearGradient>
          <linearGradient id="v-esp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a2a"/><stop offset="1" stop-color="#5a341b"/></linearGradient>
          <linearGradient id="v-blend" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a341b" stop-opacity=".95"/><stop offset="1" stop-color="#5a341b" stop-opacity="0"/></linearGradient>
        </defs>
        <ellipse cx="85" cy="250" rx="58" ry="7" fill="rgba(90,70,50,.22)"/>
        <g clip-path="url(#v-cup)">
          <rect x="30" y="64" width="110" height="180" fill="url(#v-milk)"/>
          <rect x="30" y="64" width="110" height="42" fill="url(#v-esp)"/>
          <rect x="30" y="100" width="110" height="48" fill="url(#v-blend)"/>
          <path d="M62 108 C58 124 66 132 61 150" stroke="#5a341b" stroke-width="4" fill="none" opacity=".45" stroke-linecap="round"/>
          <path d="M104 110 C108 126 100 138 106 156" stroke="#5a341b" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/>
          <rect x="30" y="64" width="110" height="7" fill="#c99a5f" opacity=".9"/>
          <circle cx="58" cy="68" r="1.6" fill="#e8c48e"/><circle cx="74" cy="66" r="1.2" fill="#e8c48e"/><circle cx="97" cy="68" r="1.5" fill="#e8c48e"/><circle cx="115" cy="66" r="1.1" fill="#e8c48e"/>
          <g fill="rgba(255,255,255,.30)" stroke="rgba(255,255,255,.85)" stroke-width="1.5">
            <rect x="50" y="76" width="30" height="30" rx="7" transform="rotate(-12 65 91)"/>
            <rect x="90" y="70" width="26" height="26" rx="6" transform="rotate(14 103 83)"/>
            <rect x="72" y="106" width="24" height="24" rx="6" transform="rotate(38 84 118)"/>
          </g>
          <g fill="#4a2c15" opacity=".55">
            <circle cx="60" cy="180" r="1.1"/><circle cx="86" cy="196" r="1"/><circle cx="108" cy="176" r="1.2"/><circle cx="72" cy="214" r="1"/><circle cx="98" cy="224" r="1.1"/>
          </g>
        </g>
        <path d="M35 58 L48 234 Q49 243 59 243 L111 243 Q121 243 122 234 L135 58 Z" fill="rgba(255,255,255,.10)" stroke="rgba(70,50,35,.30)" stroke-width="2"/>
        <path d="M44 76 L54 218" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
        <path d="M126 76 L118 208" stroke="rgba(255,255,255,.38)" stroke-width="3" stroke-linecap="round"/>
        <g fill="rgba(255,255,255,.55)">
          <circle cx="58" cy="168" r="1.8"/><circle cx="64" cy="188" r="1.3"/><circle cx="112" cy="158" r="1.6"/><circle cx="106" cy="200" r="1.3"/>
        </g>
        <rect x="30" y="52" width="110" height="10" rx="5" fill="rgba(252,249,243,.9)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <path d="M33 52 L41 37 Q42 33 47 33 L123 33 Q128 33 129 37 L137 52 Z" fill="rgba(250,246,238,.95)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <ellipse cx="85" cy="41" rx="10" ry="3" fill="rgba(70,50,35,.18)"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2a2119;">Vanilla silk</div>
      <div style="font-size: 12px; color: #6b5d4e;">香草丝绒拿铁 · 浓缩浮顶</div>
      <div style="display: flex; gap: 6px;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #5a341b;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #c99a5f;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #f3e9d9; border: 1px solid rgba(70,50,35,.2); box-sizing: border-box;"></span>
      </div>
    </div>

    <!-- ② Choco chips 巧克力碎冰沙 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg viewBox="0 0 170 260" width="184" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="k-cup"><path d="M38 62 L50 232 Q51 240 60 240 L110 240 Q119 240 120 232 L132 62 Z"/></clipPath>
          <linearGradient id="k-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a2c18"/><stop offset="1" stop-color="#2a1609"/></linearGradient>
        </defs>
        <ellipse cx="85" cy="250" rx="58" ry="7" fill="rgba(90,70,50,.22)"/>
        <g clip-path="url(#k-cup)">
          <rect x="30" y="64" width="110" height="180" fill="url(#k-body)"/>
          <path d="M48 66 C44 96 52 128 47 162" stroke="#1d0d04" stroke-width="4" fill="none" opacity=".8" stroke-linecap="round"/>
          <path d="M122 68 C126 100 118 132 123 168" stroke="#1d0d04" stroke-width="4" fill="none" opacity=".7" stroke-linecap="round"/>
          <path d="M84 70 C81 98 88 124 83 150" stroke="#1d0d04" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
          <g fill="rgba(250,242,230,.35)">
            <circle cx="66" cy="120" r="2"/><circle cx="98" cy="150" r="1.6"/><circle cx="76" cy="188" r="1.8"/><circle cx="106" cy="104" r="1.5"/>
          </g>
        </g>
        <path d="M35 58 L48 234 Q49 243 59 243 L111 243 Q121 243 122 234 L135 58 Z" fill="rgba(255,255,255,.10)" stroke="rgba(70,50,35,.30)" stroke-width="2"/>
        <path d="M44 76 L54 218" stroke="rgba(255,255,255,.45)" stroke-width="4" stroke-linecap="round"/>
        <path d="M126 76 L118 208" stroke="rgba(255,255,255,.30)" stroke-width="3" stroke-linecap="round"/>
        <g fill="rgba(255,255,255,.5)">
          <circle cx="58" cy="170" r="1.8"/><circle cx="110" cy="190" r="1.4"/>
        </g>
        <rect x="30" y="52" width="110" height="10" rx="5" fill="rgba(252,249,243,.9)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <!-- 奶油顶 -->
        <g fill="#fbf3e6" stroke="rgba(120,90,60,.15)" stroke-width="1">
          <ellipse cx="85" cy="48" rx="44" ry="14"/>
          <ellipse cx="85" cy="36" rx="33" ry="12"/>
          <ellipse cx="85" cy="26" rx="21" ry="9"/>
        </g>
        <!-- 巧克力碎 -->
        <g fill="#4a2517">
          <rect x="66" y="38" width="6" height="4" rx="1" transform="rotate(18 69 40)"/>
          <rect x="94" y="30" width="5" height="4" rx="1" transform="rotate(-22 96 32)"/>
          <rect x="80" y="44" width="5" height="3.5" rx="1" transform="rotate(40 82 46)"/>
          <rect x="104" y="42" width="5" height="4" rx="1" transform="rotate(8 106 44)"/>
          <rect x="74" y="24" width="4.5" height="3.5" rx="1" transform="rotate(-30 76 26)"/>
        </g>
        <!-- 拱形盖 -->
        <path d="M31 52 C31 10 139 10 139 52 Z" fill="rgba(255,255,255,.13)" stroke="rgba(70,50,35,.28)" stroke-width="2"/>
        <path d="M44 38 C52 24 64 15 80 13" stroke="rgba(255,255,255,.5)" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="85" cy="20.5" rx="8" ry="2.5" fill="rgba(70,50,35,.18)"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2a2119;">Choco chips</div>
      <div style="font-size: 12px; color: #6b5d4e;">巧克力碎冰沙 · 奶油拱盖</div>
      <div style="display: flex; gap: 6px;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #2a1609;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #4a2c18;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #fbf3e6; border: 1px solid rgba(70,50,35,.2); box-sizing: border-box;"></span>
      </div>
    </div>

    <!-- ③ Caramel cloud 焦糖云朵玛奇朵 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg viewBox="0 0 170 260" width="184" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="c-cup"><path d="M38 62 L50 232 Q51 240 60 240 L110 240 Q119 240 120 232 L132 62 Z"/></clipPath>
          <linearGradient id="c-milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2e4cc"/><stop offset="1" stop-color="#e6d0ab"/></linearGradient>
          <linearGradient id="c-esp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5427"/><stop offset="1" stop-color="#6f4023"/></linearGradient>
          <linearGradient id="c-blend" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f4023" stop-opacity=".95"/><stop offset="1" stop-color="#6f4023" stop-opacity="0"/></linearGradient>
        </defs>
        <ellipse cx="85" cy="250" rx="58" ry="7" fill="rgba(90,70,50,.22)"/>
        <g clip-path="url(#c-cup)">
          <rect x="30" y="64" width="110" height="180" fill="url(#c-milk)"/>
          <rect x="30" y="64" width="110" height="36" fill="url(#c-esp)"/>
          <rect x="30" y="96" width="110" height="46" fill="url(#c-blend)"/>
          <!-- 杯壁焦糖酱 -->
          <path d="M46 88 C42 120 50 152 46 186" stroke="#b06f2e" stroke-width="3.5" fill="none" opacity=".8" stroke-linecap="round"/>
          <path d="M124 92 C128 124 120 154 124 190" stroke="#b06f2e" stroke-width="3.5" fill="none" opacity=".75" stroke-linecap="round"/>
          <path d="M85 128 C82 150 88 172 84 196" stroke="#b06f2e" stroke-width="3" fill="none" opacity=".5" stroke-linecap="round"/>
          <rect x="30" y="64" width="110" height="7" fill="#d8b183" opacity=".95"/>
          <circle cx="62" cy="67" r="1.4" fill="#efd3a3"/><circle cx="92" cy="68" r="1.6" fill="#efd3a3"/><circle cx="112" cy="66" r="1.2" fill="#efd3a3"/>
          <g fill="rgba(255,255,255,.30)" stroke="rgba(255,255,255,.85)" stroke-width="1.5">
            <rect x="52" y="74" width="28" height="28" rx="7" transform="rotate(-10 66 88)"/>
            <rect x="92" y="72" width="25" height="25" rx="6" transform="rotate(16 104 84)"/>
            <rect x="70" y="104" width="23" height="23" rx="6" transform="rotate(34 81 115)"/>
          </g>
        </g>
        <path d="M35 58 L48 234 Q49 243 59 243 L111 243 Q121 243 122 234 L135 58 Z" fill="rgba(255,255,255,.10)" stroke="rgba(70,50,35,.30)" stroke-width="2"/>
        <path d="M44 76 L54 218" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
        <path d="M126 76 L118 208" stroke="rgba(255,255,255,.38)" stroke-width="3" stroke-linecap="round"/>
        <g fill="rgba(255,255,255,.55)">
          <circle cx="60" cy="172" r="1.7"/><circle cx="110" cy="162" r="1.5"/><circle cx="104" cy="204" r="1.3"/>
        </g>
        <rect x="30" y="52" width="110" height="10" rx="5" fill="rgba(252,249,243,.9)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <path d="M33 52 L41 37 Q42 33 47 33 L123 33 Q128 33 129 37 L137 52 Z" fill="rgba(250,246,238,.95)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <ellipse cx="85" cy="41" rx="10" ry="3" fill="rgba(70,50,35,.18)"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2a2119;">Caramel cloud</div>
      <div style="font-size: 12px; color: #6b5d4e;">焦糖云朵玛奇朵 · 挂壁焦糖</div>
      <div style="display: flex; gap: 6px;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #6f4023;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #b06f2e;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #f2e4cc; border: 1px solid rgba(70,50,35,.2); box-sizing: border-box;"></span>
      </div>
    </div>

    <!-- ④ Matcha mist 抹茶轻雾拿铁 -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <svg viewBox="0 0 170 260" width="184" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="m-cup"><path d="M38 62 L50 232 Q51 240 60 240 L110 240 Q119 240 120 232 L132 62 Z"/></clipPath>
          <linearGradient id="m-milk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe2"/><stop offset="1" stop-color="#e9e0cb"/></linearGradient>
          <linearGradient id="m-tea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7e9c50"/><stop offset="1" stop-color="#93b164"/></linearGradient>
          <linearGradient id="m-blend" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#93b164" stop-opacity=".95"/><stop offset="1" stop-color="#93b164" stop-opacity="0"/></linearGradient>
        </defs>
        <ellipse cx="85" cy="250" rx="58" ry="7" fill="rgba(90,70,50,.22)"/>
        <g clip-path="url(#m-cup)">
          <rect x="30" y="64" width="110" height="180" fill="url(#m-milk)"/>
          <rect x="30" y="64" width="110" height="48" fill="url(#m-tea)"/>
          <rect x="30" y="106" width="110" height="48" fill="url(#m-blend)"/>
          <path d="M64 116 C60 132 68 142 63 158" stroke="#7e9c50" stroke-width="4" fill="none" opacity=".45" stroke-linecap="round"/>
          <path d="M102 118 C106 134 98 146 104 162" stroke="#7e9c50" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/>
          <g fill="#5c7a3a" opacity=".7">
            <circle cx="56" cy="67" r="1.2"/><circle cx="72" cy="69" r="1"/><circle cx="90" cy="66" r="1.3"/><circle cx="108" cy="68" r="1"/><circle cx="120" cy="67" r="1.1"/>
          </g>
          <g fill="rgba(255,255,255,.30)" stroke="rgba(255,255,255,.85)" stroke-width="1.5">
            <rect x="50" y="76" width="30" height="30" rx="7" transform="rotate(-12 65 91)"/>
            <rect x="90" y="70" width="26" height="26" rx="6" transform="rotate(14 103 83)"/>
            <rect x="72" y="108" width="24" height="24" rx="6" transform="rotate(38 84 120)"/>
          </g>
        </g>
        <path d="M35 58 L48 234 Q49 243 59 243 L111 243 Q121 243 122 234 L135 58 Z" fill="rgba(255,255,255,.10)" stroke="rgba(70,50,35,.30)" stroke-width="2"/>
        <path d="M44 76 L54 218" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
        <path d="M126 76 L118 208" stroke="rgba(255,255,255,.38)" stroke-width="3" stroke-linecap="round"/>
        <g fill="rgba(255,255,255,.55)">
          <circle cx="58" cy="166" r="1.7"/><circle cx="112" cy="156" r="1.5"/><circle cx="66" cy="196" r="1.3"/>
        </g>
        <rect x="30" y="52" width="110" height="10" rx="5" fill="rgba(252,249,243,.9)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <path d="M33 52 L41 37 Q42 33 47 33 L123 33 Q128 33 129 37 L137 52 Z" fill="rgba(250,246,238,.95)" stroke="rgba(70,50,35,.25)" stroke-width="1.5"/>
        <ellipse cx="85" cy="41" rx="10" ry="3" fill="rgba(70,50,35,.18)"/>
      </svg>
      <div style="font-size: 15px; font-weight: 600; color: #2a2119;">Matcha mist</div>
      <div style="font-size: 12px; color: #6b5d4e;">抹茶轻雾拿铁 · 抹茶浮顶</div>
      <div style="display: flex; gap: 6px;">
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #7e9c50;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #93b164;"></span>
        <span style="width: 14px; height: 14px; border-radius: 50%; background: #f4efe2; border: 1px solid rgba(70,50,35,.2); box-sizing: border-box;"></span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
